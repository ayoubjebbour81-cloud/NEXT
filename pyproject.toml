[project]
name = "next"
version = "0.1.0"
description = "NEXT"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1,<1.0",
    "uvicorn[standard]>=0.52.4,<1.0",
    "pydantic-settings>=2.15,<3.0",
    "openai>=3.13,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "httpx>=0.28,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
